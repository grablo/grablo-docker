name: build-image

# On a version tag push or a manual run: build the amd64 + arm64 multi-arch image and push to GHCR.
#   Product (one controller source, version numbers per product — grablo-frontend docs/SPOT_RELEASE_CHANNEL.md):
#     tag v1.29.8      → core → ghcr.io/grablo/iot-core:1.29.8 + :latest  (Reflex / Studio)
#     tag spot-v2.0.0  → spot → ghcr.io/grablo/spot:2.0.0 + :latest      (Grablo Spot)
#   A manual run picks the product. The two repositories never share :latest.
#
# Each arch is built on its OWN native runner (no QEMU emulation):
#   amd64   → ubuntu-latest      (x86_64 native)
#   aarch64 → ubuntu-24.04-arm   (arm64 native, free for public repos)
# The per-arch images are pushed by digest, then a merge job assembles the
# multi-arch manifest list (:<version> + :latest). This removes the slow/flaky
# QEMU arm64 emulation (SIGSEGV on ldconfig) that previously failed the whole
# single-job multi-arch build. Ref: Docker "distribute build across runners".
on:
  push:
    tags: ['v*', 'spot-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Grablo version (e.g. 1.29.8 for core, 2.0.0 for spot)'
        required: true
      product:
        description: 'Product'
        required: true
        default: core
        type: choice
        options: [core, spot]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Resolve version + product
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"; p="${{ github.event.inputs.product }}"
          elif [[ "$GITHUB_REF_NAME" == spot-v* ]]; then
            v="${GITHUB_REF_NAME#spot-v}"; p=spot
          else
            v="${GITHUB_REF_NAME#v}"; p=core
          fi
          if [ "$p" = spot ]; then img=ghcr.io/grablo/spot; title='Grablo Spot'; else img=ghcr.io/grablo/iot-core; title='Grablo IoT Core'; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"; echo "product=$p" >> "$GITHUB_OUTPUT"
          echo "image=$img" >> "$GITHUB_OUTPUT"; echo "title=$title" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GRABLO_VERSION=${{ steps.ver.outputs.v }}
            GRABLO_PRODUCT=${{ steps.ver.outputs.product }}
            GRABLO_TITLE=${{ steps.ver.outputs.title }}
          outputs: type=image,name=${{ steps.ver.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve version + product
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"; p="${{ github.event.inputs.product }}"
          elif [[ "$GITHUB_REF_NAME" == spot-v* ]]; then
            v="${GITHUB_REF_NAME#spot-v}"; p=spot
          else
            v="${GITHUB_REF_NAME#v}"; p=core
          fi
          if [ "$p" = spot ]; then img=ghcr.io/grablo/spot; title='Grablo Spot'; else img=ghcr.io/grablo/iot-core; title='Grablo IoT Core'; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"; echo "product=$p" >> "$GITHUB_OUTPUT"
          echo "image=$img" >> "$GITHUB_OUTPUT"; echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list & push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.v }} \
            -t ${{ steps.ver.outputs.image }}:latest \
            $(printf '${{ steps.ver.outputs.image }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.v }}
